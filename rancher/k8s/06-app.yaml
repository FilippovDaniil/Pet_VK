---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: pet-vk
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 512Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pet-vk-config
  namespace: pet-vk
data:
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/social_network"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATA_REDIS_HOST: "redis"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  # OpenSearch — имя K8s Service, не localhost
  OPENSEARCH_HOST: "opensearch"
  OPENSEARCH_PORT: "9200"
  OPENSEARCH_SCHEME: "http"
  # Отключаем mail health indicator: без SMTP → 503 → readinessProbe fail
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  SERVER_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pet-vk-app
  namespace: pet-vk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pet-vk-app
  template:
    metadata:
      labels:
        app: pet-vk-app
    spec:
      # initContainers выполняются строго по порядку до старта основного контейнера
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo "Waiting for postgres..."; sleep 2; done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z redis 6379; do echo "Waiting for redis..."; sleep 2; done
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z kafka 29092; do echo "Waiting for kafka..."; sleep 2; done
        - name: wait-for-opensearch
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z opensearch 9200; do
                echo "Waiting for opensearch:9200..."
                sleep 3
              done
              echo "OpenSearch is ready!"
      containers:
        - name: app
          # Образ загружается вручную через build-and-load.ps1
          image: pet-vk-app:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: pet-vk-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pet-vk-secrets
                  key: postgres-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pet-vk-secrets
                  key: jwt-secret
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads/avatars
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pet-vk-service
  namespace: pet-vk
spec:
  selector:
    app: pet-vk-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30777
  type: NodePort
