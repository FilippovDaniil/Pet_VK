spring:
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/social_network
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:change-me}
            client-secret: ${GOOGLE_CLIENT_SECRET:change-me}
            scope: email, profile

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: social-network-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  cache:
    type: redis
    redis:
      time-to-live: 600000

opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  scheme: ${OPENSEARCH_SCHEME:http}

app:
  jwt:
    secret: ${JWT_SECRET:mySecretKeyWhichShouldBeAtLeast32CharsLong!!}
    access-token-expiration: 900000       # 15 minutes
    refresh-token-expiration: 2592000000  # 30 days
  upload:
    path: ./uploads/avatars

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.socialnetwork: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  liquibase:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6370

  kafka:
    bootstrap-servers: localhost:9093

  cache:
    type: simple

app:
  jwt:
    secret: testSecretKeyForTestingPurposesOnly12345
    access-token-expiration: 900000
    refresh-token-expiration: 2592000000
  upload:
    path: ./uploads/test/avatars

---
spring:
  config:
    activate:
      on-profile: ci

  datasource:
    url: jdbc:postgresql://localhost:5432/social_network
    username: postgres
    password: ${POSTGRES_PASSWORD:ci_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:change-me}
            client-secret: ${GOOGLE_CLIENT_SECRET:change-me}
            scope: email, profile

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: social-network-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  cache:
    type: redis
    redis:
      time-to-live: 600000

opensearch:
  host: localhost
  port: 9200
  scheme: http

app:
  jwt:
    secret: ${JWT_SECRET:ciTestSecretKeyAtLeast32CharsLong!!}
    access-token-expiration: 900000
    refresh-token-expiration: 2592000000
  upload:
    path: ./uploads/ci/avatars

management:
  health:
    mail:
      enabled: false

logging:
  level:
    com.socialnetwork: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
